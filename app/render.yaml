# Blueprint de Render: New > Blueprint > selecciona este repositorio (carpeta app/).
services:
  - type: web
    name: tita-pricing
    runtime: docker
    rootDir: app
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tita-pricing-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ
        value: America/Bogota
databases:
  - name: tita-pricing-db
    plan: basic-256mb
    databaseName: tita
    user: tita
