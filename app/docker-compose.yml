# Despliegue en un servidor propio de Tita (Ubuntu con Docker). Lo más simple: sudo ./instalar.sh
# Manual: cp .env.example .env (completa los valores) y luego: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: tita
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tita"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://tita:${POSTGRES_PASSWORD}@db:5432/tita
      PORT: 3000
  # HTTPS automático con certificado de Let's Encrypt para el dominio de DOMAIN
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:?define DOMAIN en .env} --to app:3000
    volumes:
      - caddy_data:/data
  # Copia diaria de la base de datos; conserva 14 días en ./respaldos
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./respaldos:/respaldos
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U tita tita | gzip > /respaldos/tita-$$(date +%F).sql.gz; find /respaldos -name 'tita-*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
volumes:
  pgdata:
  caddy_data:
