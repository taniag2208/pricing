# Despliegue en un servidor propio (VM en AWS, GCP, Azure, DigitalOcean…):
#   cp .env.example .env   # y completa los valores
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: tita
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tita"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://tita:${POSTGRES_PASSWORD}@db:5432/tita
      PORT: 3000
    ports:
      - "3000:3000"
volumes:
  pgdata:
